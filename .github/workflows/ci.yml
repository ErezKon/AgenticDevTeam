name: CI

on:
  push:
    branches: [ main, "*" ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.7-dind
        privileged: true
        options: --dns 8.8.8.8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies for backend
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          # Install API requirements
          pip install -r backend/api/requirements.txt --trusted-host pypi.org --trusted-host files.pythonhosted.org
          # Install MCP requirements
          pip install -r backend/mcp/requirements.txt --trusted-host pypi.org --trusted-host files.pythonhosted.org

      - name: Run backend tests
        run: |
          pytest backend/api/tests
          pytest backend/mcp/tests

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build Docker images
        run: |
          docker compose build
